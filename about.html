<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact TrackFyp</title><meta name="description" content="Contact TrackFyp support."><link rel="stylesheet" href="css/style.css"></head><body><script>window.BASE='';</script><div id="site-header"></div><main class="section container"><div class="tool-box"><span class="eyebrow">CONTACT</span><h1>Contact TrackFyp</h1><p class="small">Agar kisi tool mein problem ho, feedback dena ho, ya support chahiye ho to message bhejein.</p><form action="https://formspree.io/f/maenjken" method="POST" class="contact-form"><div class="field"><label for="name">Name</label><input id="name" name="name" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="7" required></textarea></div><input type="hidden" name="_subject" value="TrackFyp Contact Message"><button class="btn btn-hot" type="submit">Send Message</button></form></div></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/main.js"></script></body></html>
