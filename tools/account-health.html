<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Health — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE</span><h1>Account Health</h1><p class="small">Public profile link se basic consistency/visibility guidance.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>TikTok profile link</label><input id="url" placeholder="https://www.tiktok.com/@username"></div><button class="btn btn-hot" onclick="go()">Check Health</button><div id="out" class="result"></div></div><aside class="side-box"><p class="small">No tool can guarantee an account-status decision from public data alone. Treat this as guidance, not an official TikTok status.</p></aside></section></main><div id="site-footer"></div><script>async function go(){let u=document.getElementById('url').value.trim();if(!u)return;try{let d=await api('/api/channel-analyze?url='+encodeURIComponent(u));showResult('out','<b>Public health signals</b><pre style="white-space:pre-wrap">'+escapeHtml(JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>Could not check</b><p class="small">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
