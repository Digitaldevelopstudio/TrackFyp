<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Analyzer — TrackFyp Premium</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">PREMIUM AI</span><h1>AI Video Analyzer</h1><p class="small">Upload a short video and get AI feedback on hook, pacing, visual clarity, CTA and improvement opportunities.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Premium email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Video file</label><input id="video" type="file" accept="video/*"></div><button class="btn btn-hot" id="btn" onclick="go()">Analyze with AI</button><div id="out" class="result"></div></div><aside class="side-box"><div class="lock"><h3>Premium feature</h3><p class="small">This feature is part of TrackFyp Premium and is not included in the free tier.</p><a class="btn btn-hot" href="../premium.html">Get Premium</a></div></aside></section></main><div id="site-footer"></div><script>async function go(){let f=document.getElementById('video').files[0],email=document.getElementById('email').value.trim();if(!f||!email)return;let b=document.getElementById('btn');b.disabled=true;b.textContent='AI is analyzing...';let fd=new FormData();fd.append('video',f);fd.append('email',email);try{let d=await api('/api/premium-analyze',{method:'POST',body:fd});showResult('out','<b>AI result</b><pre style="white-space:pre-wrap;color:#dce0e8">'+escapeHtml(JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>Premium analysis unavailable</b><p class="small">'+escapeHtml(e.message)+'</p><a class="btn" href="../premium.html">Check Premium</a>')}finally{b.disabled=false;b.textContent='Analyze with AI'}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
