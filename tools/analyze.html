<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analyze — TrackFyp</title><meta name="description" content="Analyze a public TikTok video or creator profile with TrackFyp."><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">ANALYZE</span><h1>Analyze Your TikTok</h1><p class="small">Video ka public link ya TikTok profile link paste karein aur available public signals dekhein.</p></section><section class="container tool-layout"><div class="tool-box"><div class="tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn" id="videoTab" type="button">Video Analysis</button><button class="btn" id="channelTab" type="button">Channel Analysis</button></div><div id="videoPanel"><div class="field"><label for="videoUrl">TikTok video link</label><input id="videoUrl" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="url"></div><button class="btn btn-hot" id="videoBtn" type="button">Analyze Video</button><div id="videoOut" class="result"></div></div><div id="channelPanel" style="display:none"><div class="field"><label for="channelUrl">TikTok profile link</label><input id="channelUrl" placeholder="https://www.tiktok.com/@username" autocomplete="url"></div><button class="btn btn-hot" id="channelBtn" type="button">Analyze Channel</button><div id="channelOut" class="result"></div></div></div><aside class="side-box"><div class="ad">Advertisement</div><p class="small">Basic public analysis free hai. Advanced AI analysis Premium mein available hai.</p><a class="btn" href="ai-video-analyzer.html">AI Video Analyzer</a></aside></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/main.js"></script><script>
(function(){
const $=id=>document.getElementById(id);
$('videoTab').onclick=()=>{ $('videoPanel').style.display='block'; $('channelPanel').style.display='none'; $('videoTab').classList.add('btn-hot'); $('channelTab').classList.remove('btn-hot'); };
$('channelTab').onclick=()=>{ $('videoPanel').style.display='none'; $('channelPanel').style.display='block'; $('channelTab').classList.add('btn-hot'); $('videoTab').classList.remove('btn-hot'); };
$('videoTab').classList.add('btn-hot');
$('videoBtn').onclick=async()=>{const u=$('videoUrl').value.trim();if(!u){showResult('videoOut','<b>Video link zaroori hai.</b>');return;}const b=$('videoBtn');b.disabled=true;b.textContent='Analyzing...';try{const d=await api('/api/analyze?url='+encodeURIComponent(u));let html='<b>Video Analysis</b><div class="check-list" style="margin-top:12px">';html+='<div class="check">Growth Score: <b>'+escapeHtml(d.score??'—')+'/100</b></div>';if(d.views!=null)html+='<div class="check">Views: <b>'+escapeHtml(d.views)+'</b></div>';if(d.likes!=null)html+='<div class="check">Likes: <b>'+escapeHtml(d.likes)+'</b></div>';if(d.comments!=null)html+='<div class="check">Comments: <b>'+escapeHtml(d.comments)+'</b></div>';if(d.shares!=null)html+='<div class="check">Shares: <b>'+escapeHtml(d.shares)+'</b></div>';if(d.engagementRate!=null)html+='<div class="check">Engagement: <b>'+escapeHtml(d.engagementRate)+'%</b></div>';if(d.durationSec)html+='<div class="check">Duration: <b>'+escapeHtml(d.durationSec)+'s</b></div>';if(d.diagnosis)for(const x of d.diagnosis){html+='<div class="check">'+escapeHtml(x.text||x)+'</div>';}if(d.title)html+='<div class="check">Title: '+escapeHtml(d.title)+'</div>';html+='</div>';showResult('videoOut',html);}catch(e){showResult('videoOut','<b>Could not analyze</b><p class="small">'+escapeHtml(e.message)+'</p>');}finally{b.disabled=false;b.textContent='Analyze Video';}};
$('channelBtn').onclick=async()=>{const u=$('channelUrl').value.trim();if(!u){showResult('channelOut','<b>Profile link zaroori hai.</b>');return;}const b=$('channelBtn');b.disabled=true;b.textContent='Analyzing...';try{const d=await api('/api/channel-analyze?url='+encodeURIComponent(u));let html='<b>Channel Analysis</b><div class="check-list" style="margin-top:12px">';if(d.username)html+='<div class="check">Username: <b>'+escapeHtml(d.username)+'</b></div>';if(d.name)html+='<div class="check">Creator: <b>'+escapeHtml(d.name)+'</b></div>';if(d.followerCount!=null)html+='<div class="check">Followers: <b>'+escapeHtml(d.followerCount)+'</b></div>';if(d.followingCount!=null)html+='<div class="check">Following: <b>'+escapeHtml(d.followingCount)+'</b></div>';if(d.videoCount!=null)html+='<div class="check">Videos: <b>'+escapeHtml(d.videoCount)+'</b></div>';if(d.heartCount!=null)html+='<div class="check">Likes/Hearts: <b>'+escapeHtml(d.heartCount)+'</b></div>';if(d.diagnosis)for(const x of d.diagnosis){html+='<div class="check">'+escapeHtml(x.text||x)+'</div>';}html+='</div>';showResult('channelOut',html);}catch(e){showResult('channelOut','<b>Channel analysis unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>');}finally{b.disabled=false;b.textContent='Analyze Channel';}};
})();
</script></body></html>
