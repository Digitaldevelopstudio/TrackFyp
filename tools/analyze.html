<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basic Video Analyzer — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE</span><h1>Basic Video Analyzer</h1><p class="small">Already-published TikTok video ka public link paste karein. Basic signals aur growth suggestions dekhein.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>TikTok video link</label><input id="url" placeholder="https://www.tiktok.com/@user/video/..."/></div><button class="btn btn-hot" id="btn" onclick="go()">Analyze Video</button><div id="out" class="result"></div></div><aside class="side-box"><div class="ad">Advertisement</div><p class="small">Free analysis basic hai. Deep AI video analysis Premium mein available hai.</p><a class="btn" href="ai-video-analyzer.html">AI Analyzer</a></aside></section></main><div id="site-footer"></div><script>async function go(){let u=document.getElementById('url').value.trim();if(!u)return;let b=document.getElementById('btn');b.disabled=true;b.textContent='Analyzing...';try{let d=await api('/api/analyze?url='+encodeURIComponent(u));showResult('out',`<b>Analysis</b><div class="check-list" style="margin-top:12px"><div class="check">Score: <b>${escapeHtml(d.score??'—')}</b></div><div class="check">${escapeHtml(d.message||d.diagnosis||'Public video analysis completed.')}</div></div>`)}catch(e){showResult('out',`<b>Could not analyze</b><p class="small">${escapeHtml(e.message)}. Make sure the backend is online and the link is a public TikTok URL.</p>`)}finally{b.disabled=false;b.textContent='Analyze Video'}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
