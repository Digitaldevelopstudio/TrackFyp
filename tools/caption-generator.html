<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caption Generator — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE TOOL</span><h1>Caption Generator</h1><p class="small">Topic aur tone se quick caption options banayein.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Video topic</label><input id="topic" placeholder="e.g. 5 morning habits"></div><div class="field"><label>Tone</label><select id="tone"><option>Friendly</option><option>Educational</option><option>Funny</option><option>Motivational</option></select></div><button class="btn btn-hot" onclick="gen()">Generate Captions</button><div id="out" class="result"></div></div><aside class="side-box"><b>Need AI captions?</b><p class="small">Premium mein advanced AI caption + hook + CTA workflow milega.</p><a class="btn" href="../premium.html">Premium</a></aside></section></main><div id="site-footer"></div><script>function gen(){let t=document.getElementById('topic').value.trim(),tone=document.getElementById('tone').value;if(!t)return;let q=escapeHtml(t);let arr=[`3 things I wish I knew about ${q}. Save this for later.`,`If you're working on ${q}, start here 👇`,`Quick ${q} guide — simple, practical and worth saving.`,`Trying ${q}? Here is the part most people miss.`];showResult('out','<b>Caption ideas</b><div style="display:grid;gap:10px;margin-top:12px">'+arr.map((x,i)=>`<div class="check"><b>${i+1}.</b> ${x}<br><span class="small">Tone: ${tone}</span></div>`).join('')+'</div>')}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
