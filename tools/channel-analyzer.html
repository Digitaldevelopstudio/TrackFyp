<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Channel Analyzer — TrackFyp Premium</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">PREMIUM AI</span><h1>Channel Analyzer</h1><p class="small">Public TikTok profile ko analyze karke growth opportunities dekhein.</p></section><section class="container tool-layout" data-premium-tool="true"><div class="tool-box"><div class="field"><label>TikTok profile link</label><input id="url" placeholder="https://www.tiktok.com/@username"></div><button class="btn btn-hot" onclick="go()">Analyze Channel</button><div id="out" class="result"></div></div><aside class="side-box"><div class="lock"><h3>Premium</h3><p class="small">Advanced profile analysis is included in Premium.</p><a class="btn btn-hot" href="../premium.html">Unlock</a></div></aside></section></main><div id="site-footer"></div><script>async function go(){let u=document.getElementById('url').value.trim(),email=window.getPremiumEmail();if(!u){showResult('out','TikTok profile link ya @username enter karein.');return;}if(!email){showResult('out','<b>Premium email required</b><p class=\"small\">Upar apni subscription wali email enter karke Check Premium Status karein.</p>');return;}showResult('out','<div class=\"loading\">AI profile audit chal raha hai…</div>');try{let d=await api('/api/premium-channel-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,url:u})});let m=d.metrics||{};let cards=[['Followers',m.followers],['Following',m.following],['Total likes',m.likes],['Videos',m.videos],['Avg likes/video',m.avgLikes]];let html='<div class=\"premium-audit\"><div class=\"audit-head\"><span class=\"eyebrow\">AI CHANNEL AUDIT</span><h3>'+escapeHtml(d.name||d.username||'TikTok profile')+'</h3><p class=\"small\">Source: '+escapeHtml(d.source||'Public profile data')+'</p></div><div class=\"audit-metrics\">'+cards.map(x=>'<div class=\"audit-metric\"><span>'+x[0]+'</span><strong>'+escapeHtml(String(Number(x[1]||0).toLocaleString()))+'</strong></div>').join('')+'</div><div class=\"audit-section\"><h3>AI growth diagnosis</h3><div class=\"audit-copy\">'+escapeHtml(d.analysis||'No AI recommendations returned.').replace(/\n/g,'<br>')+'</div></div><p class=\"small\">Recommendations are estimates based on publicly available profile statistics, not a guarantee of growth.</p></div>';showResult('out',html)}catch(e){showResult('out','<b>Premium channel audit unavailable</b><p class=\"small\">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
