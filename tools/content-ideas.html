<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Ideas — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE • LIMITED</span><h1>Content Ideas</h1><p class="small">Topic enter karein. Free version mein limited ideas milengi.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Your niche</label><input id="topic" placeholder="e.g. street food, gaming, fitness"></div><button class="btn btn-hot" onclick="go()">Generate Ideas</button><div id="out" class="result"></div></div><aside class="side-box"><div class="lock"><h3>Want 30 days?</h3><p class="small">Premium 30-Day Content Planner mein organized ideas, hooks aur posting plan milega.</p><a class="btn btn-hot" href="../premium.html">Unlock Premium</a></div></aside></section></main><div id="site-footer"></div><script>function go(){let t=document.getElementById('topic').value.trim();if(!t)return;let q=escapeHtml(t);let a=[`3 mistakes beginners make in ${q}`,`Before vs after: ${q}`,`Myth vs fact about ${q}`,`A 30-second beginner guide to ${q}`,`3 quick tips for ${q}`];showResult('out','<b>Free ideas</b><div style="display:grid;gap:9px;margin-top:12px">'+a.map((x,i)=>`<div class="check">${i+1}. ${x}</div>`).join('')+'</div>')}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
