<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Content Ideas — TrackFyp</title><meta name="description" content="Generate niche-specific TikTok content ideas with TrackFyp Premium."><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">PREMIUM AI</span><h1>Content Ideas</h1><p class="small">Generate differentiated ideas, hooks, formats and CTAs for your niche. Active Premium subscription required.</p></section><section class="container tool-layout" data-premium-tool="true"><div class="tool-box"><div class="field"><label for="topic">Your niche</label><input id="topic" maxlength="180" placeholder="e.g. street food, gaming, fitness"></div><button class="btn btn-hot" id="generateIdeas" type="button" onclick="go()">Generate Premium Ideas</button><div id="out" class="result" aria-live="polite"></div></div><aside class="side-box"><div class="lock"><h3>Premium feature</h3><p class="small">Content Ideas is available only with an active Premium subscription.</p><a class="btn btn-hot" href="../premium.html">Unlock Premium</a></div></aside></section></main><div id="site-footer"></div><script>async function go(){const topic=document.getElementById('topic').value.trim(),email=window.getPremiumEmail(),btn=document.getElementById('generateIdeas');if(!topic){showResult('out','<b>Enter your niche first.</b>');return;}if(!email){showResult('out','<b>Premium required</b><p class="small">Apni subscription email enter karke Premium status verify karein.</p>');return;}btn.disabled=true;btn.textContent='Generating…';showResult('out','<div class="loading">Premium content ideas generate ho rahe hain…</div>');try{const d=await api('/api/ai-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,task:'ideas',topic})});const text=String(d.text||'').trim();if(!text)throw new Error('AI ne empty response diya.');showResult('out','<div class="audit-section"><h3>Premium content ideas</h3><div class="audit-copy" style="white-space:pre-wrap">'+escapeHtml(text)+'</div><button class="btn" type="button" id="copyIdeas">Copy ideas</button></div>');document.getElementById('copyIdeas').onclick=async()=>{try{await navigator.clipboard.writeText(text);document.getElementById('copyIdeas').textContent='Copied';}catch(_){showResult('out','<p class="small">Copy unavailable in this browser. Text select karke copy karein.</p><div style="white-space:pre-wrap">'+escapeHtml(text)+'</div>')}}}catch(e){showResult('out','<b>Content Ideas unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>')}finally{btn.disabled=false;btn.textContent='Generate Premium Ideas'}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
