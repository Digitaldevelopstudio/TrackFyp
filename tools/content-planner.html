<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30-Day Content Planner — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">PREMIUM AI</span><h1>30-Day Content Planner</h1><p class="small">A complete month of content direction built around your niche.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Niche</label><input id="topic" placeholder="e.g. home workouts"></div><div class="field"><label>Goal</label><select id="goal"><option>Grow followers</option><option>Get more views</option><option>Build authority</option><option>Sell a product</option></select></div><button class="btn btn-hot" onclick="go()">Build My Plan</button><div id="out" class="result"></div></div><aside class="side-box"><div class="lock"><h3>Premium</h3><p class="small">Save the time of planning every post manually.</p><a class="btn btn-hot" href="../premium.html">Unlock</a></div></aside></section></main><div id="site-footer"></div><script>async function go(){let t=document.getElementById('topic').value.trim(),email=prompt('Apni Premium email enter karein:');if(!t||!email)return;try{let d=await api('/api/ai-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,task:'planner',topic:t,goal:document.getElementById('goal').value})});showResult('out','<pre style="white-space:pre-wrap">'+escapeHtml(d.text||JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>AI service unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
