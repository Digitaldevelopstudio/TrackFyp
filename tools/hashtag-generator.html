<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hashtag Generator — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE TOOL</span><h1>Hashtag Generator</h1><p class="small">Niche enter karein aur related hashtags ka useful starter set banayein.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Your niche / topic</label><input id="topic" placeholder="e.g. fitness, cooking, Qatar travel"></div><button class="btn btn-hot" onclick="gen()">Generate Hashtags</button><div id="out" class="result"></div></div><aside class="side-box"><b>Tip</b><p class="small">Hashtags ko topic, niche aur audience intent ke mix mein use karein. Har post mein same list copy na karein.</p><div class="ad">Advertisement</div></aside></section></main><div id="site-footer"></div><script>function gen(){let t=document.getElementById('topic').value.trim();if(!t)return;let x=t.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'');let a=['#fyp','#foryou','#tiktok',' #viral'.trim(),`#${x}`,`#${x}tips`,`#${x}ideas`,`#${x}creator`,`#learn${x}`,`#${x}community`];showResult('out','<b>Your starter hashtags</b><div class="chips" style="margin-top:12px">'+a.map(v=>`<span class="chip">${escapeHtml(v)}</span>`).join('')+'</div>')}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
