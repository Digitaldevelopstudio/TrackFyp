<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Script Generator — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">PREMIUM AI</span><h1>AI Script Generator</h1><p class="small">Short-form script structure: hook → value → CTA.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Topic</label><input id="topic" placeholder="e.g. 5 phone camera tricks"></div><div class="field"><label>Duration</label><select id="duration"><option>15 seconds</option><option>30 seconds</option><option>45 seconds</option><option>60 seconds</option></select></div><button class="btn btn-hot" onclick="go()">Generate Script</button><div id="out" class="result"></div></div><aside class="side-box"><div class="lock"><h3>Premium AI</h3><p class="small">Use the full creation workflow without ads.</p><a class="btn btn-hot" href="../premium.html">Unlock</a></div></aside></section></main><div id="site-footer"></div><script>async function go(){let t=document.getElementById('topic').value.trim(),email=prompt('Apni Premium email enter karein:');if(!t||!email)return;try{let d=await api('/api/ai-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,task:'script',topic:t,duration:document.getElementById('duration').value})});showResult('out','<pre style="white-space:pre-wrap">'+escapeHtml(d.text||JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>AI service unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
