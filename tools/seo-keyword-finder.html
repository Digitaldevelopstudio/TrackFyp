<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyword Finder — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE TOOL</span><h1>Keyword Finder</h1><p class="small">Topic se search-friendly phrase ideas banayein.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Topic</label><input id="topic" placeholder="e.g. weight loss for beginners"></div><button class="btn btn-hot" onclick="go()">Find Keywords</button><div id="out" class="result"></div></div><aside class="side-box"><b>SEO tip</b><p class="small">One clear search phrase ko caption/on-screen text mein naturally use karein.</p></aside></section></main><div id="site-footer"></div><script>function go(){let t=document.getElementById('topic').value.trim();if(!t)return;let q=escapeHtml(t);let a=[q,`${q} tips`,`${q} for beginners`,`how to ${q}`,`${q} mistakes`,`${q} routine`,`${q} explained`];showResult('out','<b>Keyword ideas</b><div class="chips" style="margin-top:12px">'+a.map(x=>`<span class="chip">${x}</span>`).join('')+'</div>')}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
