<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visibility Health — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">FREE</span><h1>Visibility Health</h1><p class="small">Public signals check karein. Ye official TikTok enforcement detector nahi hai.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>TikTok profile or video link</label><input id="url"></div><button class="btn btn-hot" onclick="go()">Check Visibility</button><div id="out" class="result"></div></div><aside class="side-box"><p class="small">Low reach can have many causes: topic demand, retention, audience fit, posting consistency and more.</p></aside></section></main><div id="site-footer"></div><script>async function go(){let u=document.getElementById('url').value.trim();if(!u)return;try{let d=await api('/api/shadowban-check?url='+encodeURIComponent(u));showResult('out','<pre style="white-space:pre-wrap">'+escapeHtml(JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>Check unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
