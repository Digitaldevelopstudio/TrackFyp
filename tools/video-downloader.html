<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Downloader — TrackFyp</title><meta name="description" content="Download a public TikTok video when you have permission to save it."><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">UTILITY</span><h1>Video Downloader</h1><p class="small">Only download videos you have permission to save. Public links are supported when the source allows it.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label for="url">TikTok video link</label><input id="url" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="url"></div><button class="btn btn-hot" id="btn" type="button">Get Download</button><div id="out" class="result"></div></div><aside class="side-box"><p class="small">Respect creator rights and TikTok's terms. TrackFyp does not claim ownership of downloaded content.</p></aside></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/main.js"></script><script>document.getElementById('btn').onclick=()=>{const u=document.getElementById('url').value.trim();if(!u){showResult('out','<b>Video link zaroori hai.</b>');return;}const b=document.getElementById('btn');b.disabled=true;b.textContent='Preparing...';const link=(window.TRACKFYP_CONFIG.API_BASE||'')+'/api/download-file?url='+encodeURIComponent(u);showResult('out','<b>Download ready</b><p class="small">Agar video aapka hai ya aapke paas permission hai to neeche click karein.</p><a class="btn btn-hot" style="margin-top:12px" href="'+escapeHtml(link)+'">Download Video</a>');b.disabled=false;b.textContent='Get Download';};</script></body></html>
