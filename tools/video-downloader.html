<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Downloader — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">UTILITY</span><h1>Video Downloader</h1><p class="small">Only download videos you have permission to save. Public links are supported when the source allows it.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>TikTok video link</label><input id="url" placeholder="https://www.tiktok.com/@user/video/..."/></div><button class="btn btn-hot" onclick="go()">Get Download</button><div id="out" class="result"></div></div><aside class="side-box"><p class="small">Respect creator rights and TikTok's terms. TrackFyp does not claim ownership of downloaded content.</p></aside></section></main><div id="site-footer"></div><script>async function go(){let u=document.getElementById('url').value.trim();if(!u)return;try{let d=await api('/api/download-file?url='+encodeURIComponent(u));let link=d.url||d.downloadUrl||d.download_url;if(link)showResult('out',`<b>Download ready</b><br><a class="btn btn-hot" style="margin-top:12px" href="${escapeHtml(link)}" target="_blank" rel="noopener">Open Download</a>`);else showResult('out','<pre style="white-space:pre-wrap">'+escapeHtml(JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>Download unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
