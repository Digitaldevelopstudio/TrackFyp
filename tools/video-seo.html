<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video SEO Optimizer — TrackFyp</title><link rel="stylesheet" href="../css/style.css"></head><body><script>window.BASE='../';</script><div id="site-header"></div><main><section class="tool-hero container"><span class="eyebrow">PREMIUM AI</span><h1>Video SEO Optimizer</h1><p class="small">Topic, caption aur audience ko use karke stronger search-focused package banayein.</p></section><section class="container tool-layout"><div class="tool-box"><div class="field"><label>Topic</label><input id="topic"></div><div class="field"><label>Existing caption (optional)</label><textarea id="caption"></textarea></div><button class="btn btn-hot" onclick="go()">Optimize SEO</button><div id="out" class="result"></div></div><aside class="side-box"><div class="lock"><h3>Premium AI</h3><p class="small">Generate a complete SEO package: title, keywords, description, hashtags and CTA.</p><a class="btn btn-hot" href="../premium.html">Unlock</a></div></aside></section></main><div id="site-footer"></div><script>async function go(){let t=document.getElementById('topic').value.trim(),email=prompt('Apni Premium email enter karein:');if(!t||!email)return;try{let d=await api('/api/ai-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,task:'seo',topic:t,caption:document.getElementById('caption').value})});showResult('out','<pre style="white-space:pre-wrap">'+escapeHtml(d.text||JSON.stringify(d,null,2))+'</pre>')}catch(e){showResult('out','<b>AI service unavailable</b><p class="small">'+escapeHtml(e.message)+'</p>')}}</script><script src="../js/config.js"></script><script src="../js/main.js"></script></body></html>
